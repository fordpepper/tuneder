:root{--bg:#101010;--ink:#eee;--mute:#9d9d9d;--w:min(82vw,44vh,380px);box-sizing:border-box}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:bw,system-ui,sans-serif;text-transform:lowercase;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
html{scrollbar-width:none;color-scheme:dark}
::-webkit-scrollbar{display:none}
#col{position:absolute;inset:0;overflow:hidden}
.sh{position:absolute;width:var(--w);left:calc(50% - var(--w)/2);top:calc(50% - var(--w)/2);transform:translateY(var(--sy,0px));transition:transform .55s cubic-bezier(.2,.9,.3,1)}
.sh.idle{visibility:hidden;pointer-events:none}

.drag{position:relative;will-change:transform}
.cards{position:relative;aspect-ratio:1;width:100%;perspective:1100px}
.cards>.flip{left:0;top:0;width:100%;height:100%;will-change:transform}

.flip>*{position:absolute;inset:0}










.cards>*{position:absolute}
.cards img{left:0;top:0;width:100%;height:100%;object-fit:cover;border-radius:8%;background:#1c1c1c;pointer-events:none;-webkit-user-drag:none}
.cards .help{display:none;inset:0;border-radius:8%;background:#2b2b2b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);padding:8%;flex-direction:column;justify-content:center;gap:5%}
.help .logo{width:38px;height:38px;border-radius:36%;align-self:center;margin-bottom:1%;display:block}
.cards.isHelp .help{display:flex}
.cards.isHelp .flip{display:none}
.hl{display:flex;justify-content:space-between;align-items:baseline;font-size:21px}
.hl b{font-weight:400;color:var(--mute)}
.help .go{text-align:center;color:var(--mute);font-size:17px;margin-top:3%}
.pp{left:50%;top:50%;margin:-55px 0 0 -55px;width:110px;height:110px;display:grid;place-items:center;opacity:0;transform:scale(.7);transition:opacity .2s,transform .3s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.pp.on{opacity:1;transform:none}
.pp.on svg{filter:drop-shadow(0 2px 12px rgba(0,0,0,.5))}
.win{position:absolute;left:0;right:0;top:calc(100% + 22px);isolation:isolate;opacity:0;transform:scale(.92) translateY(-14px);pointer-events:none;transition:opacity .3s,transform .5s cubic-bezier(.3,1.4,.5,1)}
.win.on{opacity:1;transform:none;pointer-events:auto}
.inner{position:relative;background:#2b2b2b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);border-radius:26px;padding:20px 16px;min-height:168px;display:flex;align-items:center;justify-content:center;text-align:center}
.inner>div{display:none;width:100%}
.win.info .vInfo,.win.data .vData{display:block}
h2{font-size:24px;font-weight:400;margin:0 0 2px;line-height:1.2;overflow-wrap:anywhere}
p{margin:0 0 16px;color:var(--mute);font-size:18px;overflow-wrap:anywhere}
.row{display:flex;gap:14px;justify-content:center}
.ic{width:56px;height:56px;border-radius:36%;corner-shape:squircle;overflow:hidden;border:0;padding:0;background:#454545;display:block;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.5,.5,1),background .25s}
.ic:active{transform:scale(.88)}
.ic img,.ic svg{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.ic:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lAp{background:#FF2950}
.rst .ck{display:none}.rst.armed .ck{display:block}.rst.armed .rs{display:none}.rst.armed{background:#a33}
.bad{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#msg{position:absolute;left:0;right:0;bottom:8vh;text-align:center;color:var(--mute);font-size:18px;padding:0 24px;pointer-events:none}
.file{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(()=>{
const $=i=>document.getElementById(i),MAXB=5*1024*1024,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SEEDS=['pop','rock','hip hop','electronic','indie','r&b','jazz','country','latin','metal','classical','k-pop','reggae','soul','folk','dance','punk','house','blues','ambient','funk','disco','afrobeats','shoegaze'];
let S={w:{},c:{},dalb:[],seen:[],liked:[],n:0},seen=new Set(),pE=[],pX=[],recent=[],recAl=[],recG=[],histA=[],cool={},busy=false,unl=false,sinceX=9,cur=null;
const audio=new Audio();audio.preload='auto';
try{const s=JSON.parse(localStorage.getItem('tuneder')||localStorage.getItem('ss')||'null');if(s&&s.w)S=s}catch(e){}
S.seen.forEach(x=>seen.add(x));
try{(JSON.parse(localStorage.getItem('tuneder-pool')||'[]')).forEach(t=>{if(t&&t.prev&&t.art&&!seen.has(t.id))(t.x?pX:pE).push(t)})}catch(e){}
S.c=S.c||{};S.dalb=S.dalb||[];S.r=S.r||{};S.o=S.o||[];S.v=0;
const save=()=>{setTimeout(()=>savePool(),0);try{localStorage.setItem('tuneder',JSON.stringify({w:S.w,c:S.c,dalb:S.dalb.slice(-300),seen:S.seen.slice(-3000),liked:S.liked.slice(-500),n:S.n,h:S.h,r:S.r,o:S.o.slice(-20)}))}catch(e){}};
/* song cache: leftover Apple tracks (their preview links don't expire) let the next visit start with no network wait */
const POOL_K='tuneder-pool';
const savePool=()=>{try{localStorage.setItem(POOL_K,JSON.stringify([...pE,...pX].filter(t=>t.id>0).slice(0,40)))}catch(e){}};
const hap=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- taste engine ---------- */
const W=k=>S.w[k]||0,R=k=>S.r[k]||0,CN=k=>S.c[k]||0,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const STOP=new Set(['music','and','the','world','other','general','new']);
const fam=g=>[...new Set(g.split(/[\s\/&,\-]+/).filter(w=>w.length>2&&!STOP.has(w)))].slice(0,3);
const script=s=>/[\u3040-\u30ff]/.test(s)?'ja':/[\uac00-\ud7af]/.test(s)?'ko':/[\u4e00-\u9fff]/.test(s)?'zh':/[\u0400-\u04ff]/.test(s)?'ru':/[\u0600-\u06ff]/.test(s)?'ar':/[\u0900-\u097f]/.test(s)?'hi':'la';
const audRe=/h[öo]r(buch|bücher|buecher|spiel|bücher)|audio ?book|spoken|podcast|lesung|sprach|speech|storytelling|kinder(lieder|geschichten)?$/i,audName=/h[öo]rbuch|h[öo]rspiel|audio ?book|podcast/i;
const junkRe=/karaoke|tribute|made famous|originally performed|lullaby|8-bit|cover version|piano version|in the style of|workout|ringtone/i;
let LN=S.liked.slice(-80).map(l=>String(l[2]).toLowerCase()).filter(n=>n.length>3);
/* older saves used capitalised genres and no genre families: convert them so imported taste still matches */
function migrate(){
  const o={};
  for(const k in S.w){const nk=k[0]==='g'?'g:'+k.slice(2).toLowerCase():k;if(Math.abs(S.w[k])>Math.abs(o[nk]||0))o[nk]=S.w[k]}
  Object.keys(o).forEach(k=>{if(k[0]==='g')fam(k.slice(2)).forEach(w=>{const fk='f:'+w,v=o[k]*.8;if(Math.abs(v)>Math.abs(o[fk]||0))o[fk]=v})});
  S.w=o;const c={};for(const k in S.c){const nk=k[0]==='g'?'g:'+k.slice(2).toLowerCase():k;c[nk]=Math.max(c[nk]||0,S.c[k])}S.c=c;
}
migrate();
const feats=t=>{const f=[['a:'+t.aid,1],['l:'+t.lang,.3]];if(t.genre!=='?')f.push(['g:'+t.genre,.6]);t.fam.forEach(w=>f.push(['f:'+w,.5]));if(t.dec)f.push(['d:'+t.dec,.25]);return f};
const hasInfo=()=>Object.values(S.w).some(v=>v>.5);
const top=(p,n)=>Object.entries(S.w).filter(([k,v])=>k[0]==p&&v>.4).sort((a,b)=>b[1]-a[1]).slice(0,n);
const wpick=l=>{let r=Math.random()*l.reduce((a,[,v])=>a+v,0);for(const[k,v]of l){if((r-=v)<=0)return k.slice(2)}return l[0][0].slice(2)};
/* hard "no": clearly disliked artist or genre family */
const neg=t=>W('a:'+t.aid)<-1.2||W('g:'+t.genre)<-1.5||t.fam.some(w=>W('f:'+w)<-1.2);
/* short cool-down after a skip: no more of that genre for a few songs */
const blocked=t=>(cool['g:'+t.genre]||0)>S.n||t.fam.some(w=>(cool['f:'+w]||0)>S.n);
/* songs that only mention a liked artist (tributes, covers) */
const RX={},rx=n=>RX[n]||(RX[n]=new RegExp('(^|[^a-z0-9])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])'));
const imposter=t=>{const s=(t.name+' '+t.artist).toLowerCase(),a=t.artist.toLowerCase();return LN.some(n=>n!==a&&!a.includes(n)&&!n.includes(a)&&rx(n).test(s))};
const ok0=t=>!audRe.test(t.genre)&&!audName.test(t.name)&&!seen.has(t.id)&&!S.dalb.includes(t.cid)&&!neg(t)&&!junkRe.test(t.name+' '+t.artist)&&!imposter(t);
const ok=t=>ok0(t)&&!blocked(t)&&!recAl.slice(0,8).includes(t.cid)&&!recent.slice(0,3).includes(t.aid);
function learn(t,dir,frac){
  /* graded signal: a like after a full listen counts most, a skip in the first seconds is a firm no, a skip near the end is mild */
  const m=dir>0?.8+.7*clamp(frac,0,1):(frac<.15?1.5:frac<.5?1.1:.5);
  /* short-term "mood" profile: decays fast, so the current session steers the next songs */
  for(const k in S.r){S.r[k]*=.9;if(Math.abs(S.r[k])<.05)delete S.r[k]}
  feats(t).forEach(([k,f])=>{S.w[k]=clamp(W(k)+(dir>0?1:-1.1)*f*m,-6,6);S.r[k]=clamp(R(k)+(dir>0?1:-1)*f*m,-4,4);S.c[k]=CN(k)+1});
  S.o.push(dir>0?1:0);if(S.o.length>20)S.o.shift();
  for(const k in S.w){S.w[k]*=.995;if(Math.abs(S.w[k])<.03)delete S.w[k]}
  S.n++;if(S.n%50==0)for(const k in S.c)if(!(k in S.w))delete S.c[k];
  S.seen.push(t.id);seen.add(t.id);
  if(dir>0){S.liked.push([t.id,t.name,t.artist,t.genre,t.aid]);const n=t.artist.toLowerCase();if(n.length>3)LN.push(n)}
  else{
    S.dalb.push(t.cid);
    if(t.genre!=='?')cool['g:'+t.genre]=S.n+10;t.fam.forEach(w=>cool['f:'+w]=S.n+6);
    const bad=W('a:'+t.aid)<-.9,keep=p=>p.cid!==t.cid&&!(bad&&p.aid===t.aid);
    pE=pE.filter(keep);pX=pX.filter(keep);
    nsq.forEach(x=>{if(x.t&&(!keep(x.t)||blocked(x.t)))x.good=false});
  }
  save();
}
/* hit rate over the last swipes: tells the engine how well it knows you */
const rate=()=>S.o.length<5?-1:S.o.reduce((a,b)=>a+b,0)/S.o.length;
const explore=()=>{const q=rate();return q<0?.34:clamp(.5-.4*q,.15,.42)};
const temp=()=>{const q=rate();return q<0?.45:clamp(.62-.35*q,.28,.6)};
const score=t=>feats(t).reduce((s,[k,f])=>s+f*(W(k)+.7*R(k))+.3*f/Math.sqrt(CN(k)+1),0)-.7*histA.filter(a=>a===t.aid).length-.4*recG.slice(0,3).filter(g=>g===t.genre).length;
function take(x,lv){
  const P=x?pX:pE;let c=P.filter(ok);
  if(!c.length&&lv>0)c=P.filter(ok0);
  if(!c.length&&lv>1)c=P.filter(t=>!seen.has(t.id));
  if(!c.length)return null;
  let t;
  if(x){const d=c.filter(t=>!recG.slice(0,3).includes(t.genre));t=pick(d.length?d:c)}
  else{const s=c.map(t=>[t,score(t)+Math.random()*.2]).sort((a,b)=>b[1]-a[1]).slice(0,10),mx=s[0][1],w=s.map(([,v])=>Math.exp((v-mx)/temp()));
    let r=Math.random()*w.reduce((a,b)=>a+b),i=0;while(i<w.length-1&&(r-=w[i])>0)i++;t=s[i][0]}
  if(x)pX=pX.filter(p=>p!==t);else pE=pE.filter(p=>p!==t);

const tf=(a,b,r=0)=>`translate3d(${a}px,${b*.6}px,0) rotate(${a/16+r}deg)`;
const renderC=(s,r=0)=>{s.drag.style.transform=tf(s.C.x,s.C.y,r)};
const baseShift=s=>-Math.min(95,Math.max(0,(innerHeight-s.cards.offsetWidth)/2-24));
/* the cover makes room for the pop-up, and drifts back to the middle once the pop-up is pulled far enough away */
const renderW=s=>{const w=s.Wn,base=baseShift(s);
  if(s.mode){const cw=s.cards.offsetWidth,away=Math.max(clamp(w.y/190,0,1),clamp((Math.abs(w.x)-cw*.45)/(cw*.45),0,1)),room=-Math.max(0,(innerHeight-cw)/2-24);
    s.el.style.setProperty('--sy',Math.max((base-Math.max(0,-w.y))*(1-away),room)+'px')}
  if(!w.x&&!w.y){s.win.style.transform='';s.win.style.transition='';s.win.style.opacity='';s.el.style.transition=''}
  else s.win.style.transform=`translate3d(${w.x}px,${w.y}px,0) rotate(${w.x/30}deg)`};
const open=(s,id)=>{cancelAnimationFrame(s.raf.w);s.Wn.x=s.Wn.y=0;s.win.style.transition='';s.win.style.opacity='';s.win.style.transform='';
  s.win.className='win'+(id?' on '+id:'');s.mode=id||'';s.el.style.transition='';s.el.style.setProperty('--sy',(id?baseShift(s):0)+'px');if(id==='info')resolveLinks(s)};

const slots=[0,1,2,3,4,5,6,7].map(()=>{
  const el=tpl.content.firstElementChild.cloneNode(true);setLogo(el);col.appendChild(el);
  const q=c=>el.querySelector(c),s={el,drag:q('.drag'),cards:q('.cards'),cover:q('.cover'),flip:q('.flip'),fid:{a:0,w:0,sc:1,tsc:1,raf:0,hold:false,pa:0,hist:[],tk:0,th:0},pp:q('.pp'),win:q('.win'),
    tName:q('.tName'),tArtist:q('.tArtist'),lSp:q('.lSp'),lYt:q('.lYt'),lAp:q('.lAp'),C:{x:0,y:0},Wn:{x:0,y:0},raf:{c:0,w:0},mode:'',t:null,state:'idle',ready:false,good:true};
  q('.exp').onclick=doExport;const f=q('.file');q('.imp').onclick=()=>f.click();f.onchange=e=>doImport(e,q('.imp'));
  const rb=q('.rst');rb.onclick=()=>{
    if(!rb.classList.contains('armed')){rb.classList.add('armed');hap(8);clearTimeout(armT);armT=setTimeout(()=>rb.classList.remove('armed'),2600);return}
    clearTimeout(armT);rb.classList.remove('armed');hap([10,30,10]);
    try{localStorage.removeItem('tuneder');localStorage.removeItem('ss')}catch(e){}
    setTimeout(()=>location.reload(),150)};
  return s});
function spring(s,P,vx,vy,render,id,k=230,c=20){
  cancelAnimationFrame(s.raf[id]);let a=vx*1000,b=vy*1000,t0=performance.now();
  const step=t=>{const dt=clamp((t-t0)/1000,0,.05),n=Math.ceil(dt*240),h=dt/(n||1);t0=t;
    for(let i=0;i<n;i++){a+=(-k*P.x-c*a)*h;b+=(-k*P.y-c*b)*h;P.x+=a*h;P.y+=b*h}
    render();
    if(Math.abs(P.x)+Math.abs(P.y)<.4&&Math.abs(a)+Math.abs(b)<8){P.x=P.y=0;render()}else s.raf[id]=requestAnimationFrame(step)};
  s.raf[id]=requestAnimationFrame(step);
}

const sync=()=>{slots.forEach(s=>{s.pp.classList.toggle('on',s===cs&&audio.paused&&!flying&&!!cur&&!cur.help&&!fidget);s.el.classList.toggle('paused',audio.paused)})};
audio.addEventListener('play',sync);audio.addEventListener('pause',sync);
audio.addEventListener('ended',()=>{audio.currentTime=0;audio.play().catch(()=>{})});
function play(){audio.play().catch(()=>{unl=true;const E=['pointerdown','pointerup','touchend','click','keydown'];const f=()=>audio.play().then(()=>E.forEach(n=>removeEventListener(n,f,true))).catch(()=>{});E.forEach(n=>addEventListener(n,f,true));sync()})}
function show(t){
  audio.src=t.prev;audio.currentTime=0;play();
  try{if(navigator.mediaSession)navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist,artwork:[{src:t.art,sizes:'450x450',type:'image/jpeg'}]})}catch(e){}
  setTimeout(sync,60);
}
async function prep(s,t){
  s.ready=false;s.t=t;s.cover.src=t.lo||t.art;
  s.tName.textContent=t.name;s.tArtist.textContent=t.artist;
  const q=encodeURIComponent(t.name+' '+t.artist);
  s.lSp.href='https://open.spotify.com/search/'+q;s.lYt.href='https://music.youtube.com/search?q='+q;s.lAp.href=t.url;
  try{await s.cover.decode()}catch(e){}
  s.ready=true;
  /* a tiny cover shows first so the card is ready almost at once; the sharp one replaces it when it arrives */
  if(t.lo&&t.lo!==t.art){const im=new Image();im.src=t.art;im.decode().then(()=>{if(s.t===t)s.cover.src=t.art}).catch(()=>{})}
  if(s.t===t){s.pre=new Audio();s.pre.preload='auto';s.pre.src=t.prev}
}
/* direct song links: ask Odesli for the exact Spotify / YouTube Music / Apple Music pages (search links stay as a fallback) */
async function resolveLinks(s){
  const t=s.t;if(!t||t.help||t.linked||!t.src)return;t.linked=true;
  const set=(el,u)=>{if(u&&s.t===t)el.href=u};let L=null;
  try{const r=await fetch('https://api.song.link/v1-alpha.1/links?url='+encodeURIComponent(t.src));if(r.ok)L=(await r.json()).linksByPlatform}catch(e){}
  if(L){set(s.lSp,L.spotify&&L.spotify.url);set(s.lYt,L.youtubeMusic&&L.youtubeMusic.url);set(s.lAp,L.appleMusic&&L.appleMusic.url)}
  if(!(L&&L.appleMusic)&&t.aid<0){const j=await jsonp('https://itunes.apple.com/search?media=music&entity=song&limit=1&term='+encodeURIComponent(t.name+' '+t.artist)),r=j&&j.results&&j.results[0];if(r)set(s.lAp,r.trackViewUrl)}
}
async function acquire(){let s;while(!(s=slots.find(x=>x.state==='idle')))await sleep(40);s.state='standby';return s}
/* make sure a decoded next card is waiting off to the side */
/* keep two decoded cards ready so quick swipes never wait */
async function ensure(){
  if(filling)return;filling=true;
  try{for(;;){
    nsq=nsq.filter(x=>{if(!x.good){x.state='idle';x.ready=false;return false}return true});
    if(nsq.length>=5)break;
    const t=await getOne(),s=await acquire();s.good=true;s.t=t;nsq.push(s);prep(s,t);
  }}finally{filling=false}
}
const takeReady=()=>{const i=nsq.findIndex(x=>x.ready&&x.good);return i<0?null:nsq.splice(i,1)[0]};
function go(s){s.state='cur';cs=s;cur=s.t;enter(s);show(s.t);flying=false;sync();ensure();refill()}
function enter(s){const C=s.C;C.x=0;C.y=-(innerHeight/2+s.cards.offsetWidth/2+170)/.6;renderC(s);s.el.style.zIndex=2;s.el.classList.remove('idle');enterAt=performance.now();spring(s,C,0,0,()=>renderC(s),'c',210,23)}
function recycle(s){
  s.el.classList.add('idle');s.el.style.zIndex='';s.el.style.transition='none';s.el.style.setProperty('--sy','0px');killWin(s);s.cards.classList.remove('isHelp');s.pre=null;cancelAnimationFrame(s.fid.raf);Object.assign(s.fid,{a:0,w:0,sc:1,tsc:1,raf:0,hold:false});s.flip.style.transform='';
  s.drag.style.opacity='';s.drag.style.transform='';s.C.x=s.C.y=0;s.t=null;s.ready=false;void s.el.offsetWidth;s.el.style.transition='';s.state='idle';
}
/* the old card flies off while the next one glides in right away */
function outFly(s,dir,vx,vy){
  s.el.style.zIndex=3;cancelAnimationFrame(s.raf.c);
  let v=dir*Math.max(Math.abs(vx)*1000,1300),w=vy*500,t0=performance.now();const C=s.C;
  const step=t=>{const dt=clamp((t-t0)/1000,0,.05);t0=t;v*=1+4.5*dt;C.x+=v*dt;C.y+=w*dt;
    s.drag.style.transform=tf(C.x,C.y,dir*Math.min(14,Math.abs(v)/220));
    s.drag.style.opacity=clamp(1.7-Math.abs(C.x)/(innerWidth*.9),0,1);
    if(Math.abs(C.x)>innerWidth*1.15)recycle(s);else requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function fly(dir,vx,vy){
  if(!cur||flying||cs.mode||fidget)return;
  if(!cur.help)learn(cur,dir,audio.duration?audio.currentTime/audio.duration:0);
  flying=true;cur=null;audio.pause();hap(dir>0?14:9);
  const old=cs;old.state='out';outFly(old,dir,vx,vy);
  const s=takeReady();if(s){go(s);return}
  ensure();(async()=>{let s;while(!(s=takeReady())){await sleep(16);ensure()}go(s)})();
}
/* an open pop-up takes over every swipe and is thrown away in any direction */
function dismiss(s,vx,vy){
  s.mode='';hap(6);s.el.style.transition='';s.el.style.setProperty('--sy','0px');
  cancelAnimationFrame(s.raf.w);s.win.style.transition='none';const w=s.Wn;
  let m=Math.hypot(vx,vy);
  if(m<.3){const d=Math.hypot(w.x,w.y);if(d>1){vx=w.x/d;vy=w.y/d}else{vx=0;vy=1}m=1}
  const ux=vx/m,uy=vy/m;let v=Math.max(m*1000,900),t0=performance.now();
  const step=t=>{const dt=clamp((t-t0)/1000,0,.05);t0=t;v*=1+4*dt;w.x+=ux*v*dt;w.y+=uy*v*dt;
    const dist=Math.hypot(w.x,w.y);renderW(s);s.win.style.opacity=clamp(1.3-dist/(innerHeight*.7),0,1);
    if(dist>innerHeight*.9){if(!s.mode)killWin(s)}else s.raf.w=requestAnimationFrame(step)};
  s.raf.w=requestAnimationFrame(step);
}
/* double tap: fidget mode. The cover grows a little and can be grabbed by its sides and spun like a fidget spinner */
function kickFidget(s){
  const f=s.fid;if(f.raf)return;let t0=performance.now();
  const step=t=>{const dt=Math.min(.05,(t-t0)/1000);t0=t;
    f.sc+=(f.tsc-f.sc)*(1-Math.exp(-dt*12));
    if(!f.hold){
      if(fidget){const sg=Math.sign(f.w);f.w-=(.35*f.w+28*sg)*dt;if(Math.sign(f.w)!==sg)f.w=0;f.a+=f.w*dt}
      else{const tg=Math.round(f.a/360)*360;f.w+=(-140*(f.a-tg)-24*f.w)*dt;f.a+=f.w*dt}
    }
    if(Math.abs(f.a-f.tk)>=120){f.tk=f.a;if(fidget&&t-f.th>50){f.th=t;hap(3)}}
    s.flip.style.transform=`rotate(${f.a}deg) scale(${f.sc})`;
    const still=fidget?(!f.hold&&f.w===0&&Math.abs(f.sc-f.tsc)<.002):(Math.abs(f.a-Math.round(f.a/360)*360)<.05&&Math.abs(f.w)<.5&&Math.abs(f.sc-1)<.002);
    if(still){f.raf=0;if(!fidget){f.a=0;f.w=0;f.tk=0;s.flip.style.transform=''}}else f.raf=requestAnimationFrame(step)};
  f.raf=requestAnimationFrame(step);
}
const polar=(s,x,y)=>{const r=s.cards.getBoundingClientRect(),dx=x-r.left-r.width/2,dy=y-r.top-r.height/2;return{a:Math.atan2(dy,dx)*180/Math.PI,d:Math.hypot(dx,dy)/r.width}};
function grab(s,x,y){const f=s.fid,p=polar(s,x,y);f.w0=f.w;f.w=0;f.hold=p.d>.2;if(f.hold){f.pa=p.a;f.hist=[[performance.now(),f.a]]}kickFidget(s)}
function drag(s,x,y){const f=s.fid;if(!f.hold)return;const p=polar(s,x,y);let da=p.a-f.pa;if(da>180)da-=360;if(da<-180)da+=360;
  f.pa=p.a;f.a+=da;const n=performance.now();f.hist.push([n,f.a]);while(f.hist.length>2&&n-f.hist[0][0]>100)f.hist.shift()}
function release(s){const f=s.fid;if(f.hold){const h=f.hist,a=h[0],b=h[h.length-1],n=performance.now();
    let m=(n-b[0]<80&&b[0]>a[0])?(b[1]-a[1])/(b[0]-a[0])*1000:0;if(m&&f.w0&&Math.sign(m)===Math.sign(f.w0))m+=f.w0*.6;f.w=clamp(m,-14000,14000);f.hold=false}kickFidget(s)}
function toggleFidget(s){fidget=!fidget;const f=s.fid;hap(10);f.tsc=fidget?1.1:1;if(!fidget)f.hold=false;sync();kickFidget(s)}
const togglePlay=()=>audio.paused?audio.play():audio.pause();
let tapT=0;
function tapCover(s){
  if(cur&&cur.help)return;
  const n=performance.now(),dbl=n-lastTap<260;lastTap=dbl?0:n;
  if(dbl){clearTimeout(tapT);if(fidget||!s.mode)toggleFidget(s);return}
  if(fidget)return;
  if(unl){unl=false;return}
  clearTimeout(tapT);tapT=setTimeout(togglePlay,260);
}
const vertical=dir=>{if(cur&&cur.help||fidget)return;open(cs,dir<0?'info':'data');hap(6)};
/* gestures: swipe from anywhere */
let FD={x:0,y:0},sx=0,sy=0,ox=0,oy=0,down=false,moved=false,crossed=false,inCard=false,tgt='c',hist=[],gS=null;
const vel=()=>{const n=hist.length;if(n<2)return[0,0];const b=hist[n-1],a=hist.find(h=>b[2]-h[2]<100)||hist[0],dt=Math.max(8,b[2]-a[2]);return[(b[0]-a[0])/dt,(b[1]-a[1])/dt]};
addEventListener('pointerdown',e=>{
  if(!cur||flying||!cs)return;
  gS=cs;tgt=fidget?'i':gS.mode?'w':'c';
  const P=tgt==='c'?gS.C:gS.Wn;cancelAnimationFrame(gS.raf[tgt]);if(tgt==='w'){gS.win.style.transition='none';gS.el.style.transition='none'}if(tgt==='i')grab(gS,e.clientX,e.clientY);
  down=true;moved=false;crossed=false;FD.x=FD.y=0;sx=e.clientX-P.x;sy=e.clientY-P.y;ox=e.clientX;oy=e.clientY;hist=[[e.clientX,e.clientY,e.timeStamp]];
  const r=gS.cards.getBoundingClientRect();inCard=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
});
addEventListener('pointermove',e=>{
  if(!down)return;if(tgt==='i'){if(Math.hypot(e.clientX-ox,e.clientY-oy)>8)moved=true;drag(gS,e.clientX,e.clientY);return}const s=gS,P=tgt==='c'?s.C:s.Wn;P.x=e.clientX-sx;P.y=e.clientY-sy;FD.x=e.clientX-ox;FD.y=e.clientY-oy;
  if(Math.hypot(FD.x,FD.y)>8)moved=true;
  hist.push([e.clientX,e.clientY,e.timeStamp]);if(hist.length>8)hist.shift();
  if(tgt==='c'&&Math.abs(FD.x)>Math.abs(FD.y)&&Math.abs(FD.x)>110&&!crossed){crossed=true;hap(5)}else if(Math.abs(FD.x)<90)crossed=false;
  if(!qd){qd=true;requestAnimationFrame(flush)}
});
/* apply the drag once per frame (Firefox delivers touch events faster than frames) */
function flush(){qd=false;if(!down)return;const s=gS;if(tgt==='c')renderC(s,clamp(vel()[0]*2,-8,8));else renderW(s)}
function end(){
  if(!down)return;down=false;const s=gS,[vx,vy]=vel();
  if(moved){suppress=true;setTimeout(()=>suppress=false,60)}
  if(tgt==='i'){release(s);if(!moved)tapCover(s);return}
  if(tgt==='w'){const d=Math.hypot(s.Wn.x,s.Wn.y),sp=Math.hypot(vx,vy);
    if(!moved){spring(s,s.Wn,0,0,()=>renderW(s),'w');if(inCard)tapCover(s);return}
    if(moved&&(d>60||(sp>.45&&d>15)))dismiss(s,vx,vy);else spring(s,s.Wn,vx,vy,()=>renderW(s),'w');return}
  const back=(a,b)=>spring(s,s.C,a,b,()=>renderC(s),'c'),ax=Math.abs(FD.x),ay=Math.abs(FD.y);
  if(!moved){back(0,0);if(inCard)tapCover(s);return}
  if(ax>ay&&(ax>110||(Math.abs(vx)>.55&&ax>30))){fly(Math.abs(vx)>.55?Math.sign(vx):Math.sign(FD.x),vx,vy);return}
  if(ay>=ax&&(ay>80||(Math.abs(vy)>.5&&ay>25))&&performance.now()-enterAt>500)vertical(FD.y<0?-1:1);
  back(vx,vy);
}
addEventListener('pointerup',end);addEventListener('pointercancel',end);
addEventListener('click',e=>{if(suppress){e.preventDefault();e.stopPropagation()}},true);
addEventListener('keydown',e=>{
  if(!cs)return;const o=cs.mode||fidget;
  if(e.key==='ArrowRight'&&!o){cs.C.x=cs.C.y=0;fly(1,0,0)}else if(e.key==='ArrowLeft'&&!o){cs.C.x=cs.C.y=0;fly(-1,0,0)}
  else if(e.key==='ArrowUp'&&!o)vertical(-1);else if(e.key==='ArrowDown'&&!o)vertical(1);
  else if(e.key==='Escape'){if(fidget)toggleFidget(cs);else if(cs.mode)dismiss(cs,0,0)}
  else if(e.key===' '&&!fidget){e.preventDefault();togglePlay()}});

/* ---------- data import / export ---------- */
function doExport(){
  let sl=S.seen.slice(-20000),lk=S.liked.slice(-2000),blob;
  do{blob=new Blob([JSON.stringify({app:'tuneder',v:4,n:S.n,w:S.w,c:S.c,r:S.r,o:S.o,dalb:S.dalb.slice(-300),seen:sl,liked:lk})],{type:'application/json'});
     if(blob.size>MAXB){sl=sl.slice(Math.floor(sl.length/2));lk=lk.slice(Math.floor(lk.length/2))}}while(blob.size>MAXB&&sl.length>10);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tuneder-taste.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);hap(8)}
async function doImport(e,btn){const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>MAXB)return bad(btn);
  try{const j=JSON.parse(await f.text());if(!['tuneder','swipe-sounds'].includes(j.app)||typeof j.w!=='object')throw 0;
    S.w={};for(const k in j.w)if(/^[agdlf]:/.test(k)&&typeof j.w[k]==='number')S.w[k]=clamp(j.w[k],-6,6);
    S.c={};for(const k in(j.c||{}))if(/^[agdlf]:/.test(k)&&Number.isFinite(j.c[k]))S.c[k]=j.c[k];
    S.dalb=Array.isArray(j.dalb)?j.dalb.filter(Number.isFinite).slice(-300):[];
    S.seen=Array.isArray(j.seen)?j.seen.filter(Number.isFinite).slice(-20000):[];S.liked=Array.isArray(j.liked)?j.liked.slice(-2000):[];S.n=+j.n||0;S.r={};for(const k in(j.r||{}))if(/^[agdlf]:/.test(k)&&Number.isFinite(j.r[k]))S.r[k]=clamp(j.r[k],-4,4);S.o=Array.isArray(j.o)?j.o.filter(v=>v===0||v===1).slice(-20):[];
    migrate();seen=new Set(S.seen);LN=S.liked.slice(-80).map(l=>String(l[2]).toLowerCase()).filter(n=>n.length>3);cool={};pE=[];pX=[];sinceX=9;save();hap(12);setTimeout(()=>location.reload(),150);
  }catch(err){bad(btn)}}

/* start immediately */
(async()=>{refill();
  if(!S.h){const s=await acquire();s.state='cur';cs=s;cur=s.t=HELP;s.cards.classList.add('isHelp');s.ready=true;S.h=1;save();enter(s);sync();ensure();return}
  ensure();let s;while(!(s=takeReady()))await sleep(16);go(s)})();
})();
